<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts</title>
    <link rel="stylesheet" href="ContBook_IK.css">
</head>

<body>
    <div class="container">
        <!-- Ліва панель: Список контактів -->
        <aside class="sidebar">
            <header class="sidebar-header">
                <div class="title-group">
                    <h1>Contacts</h1>
                    <span class="count" id="contacts-counter">0 saved</span>
                </div>

                <button type="button" class="btn-add" id="add-contact-btn" aria-label="Додати новий контакт">
                    + Add contact
                </button>
            </header>

            <search class="search-box">
                <form onsubmit="return false;">
                    <svg xmlns="http://w3.org" width="14" height="14" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide-search">
                        <path d="m21 21-4.34-4.34" />
                        <circle cx="11" cy="11" r="8" />
                    </svg>

                    <input type="search" id="search-input" placeholder="Search name, phone, or email"
                        aria-label="Пошук контактів">
                </form>
            </search>

            <!-- Навігація по контактах -->
            <nav class="contacts-nav" id="contacts-list-data" aria-label="Список контактів">
            </nav>
        </aside>

        <!-- Права панель: Деталі (Add / Edit) -->
        <main class="main-content">
            <header class="profile-header">
                <div class="profile-summary">
                    <div class="avatar-large" id="detail-initials" aria-hidden="true">MN</div>

                    <div class="profile-title">
                        <h2 id="panel-title">Contact Profile</h2>
                        <p class="timestamp" id="detail-date">
                            Select a contact or click Add contact
                        </p>
                    </div>
                </div>

                <div class="action-buttons" id="view-actions">
                    <button type="button" class="btn-edit" id="edit-btn">Edit</button>
                    <button type="button" class="btn-delete" id="delete-btn">Delete</button>
                </div>
            </header>

            <form id="contact-form" novalidate style="display: flex; flex-direction: column; gap: 20px; height: 100%;">
                <input type="hidden" id="contact-id">

                <dl class="details-grid">

                    <div class="table-row">
                        <dt class="label">PHONE</dt>
                        <dd class="value" style="width: 100%;">
                            <input type="text" id="input-phone" readonly
                                style="width: 100%; border: none; font-size: 17px; font-weight: 500; color: var(--text-main); outline: none; background: transparent;">
                        </dd>
                    </div>

                    <div class="table-row">
                        <dt class="label">EMAIL</dt>
                        <dd class="value"
                            style="flex-direction: column; align-items: flex-start; gap: 4px; width: 100%;">
                            <input type="email" id="input-email" readonly
                                style="width: 100%; border: none; font-size: 17px; font-weight: 500; color: var(--text-main); outline: none; background: transparent;">
                            <span class="error-message" id="error-email"
                                style="color: var(--danger-color); font-size: 12px; font-weight: 600; display: none;"></span>
                        </dd>
                    </div>

                    <div class="table-row">
                        <dt class="label">NOTE</dt>
                        <dd class="value value-note" style="width: 100%;">
                            <textarea id="input-note" readonly
                                style="width: 100%; border: none; font-size: 17px; font-family: inherit; color: var(--text-sub); outline: none; background: transparent; resize: none; min-height: 60px;"></textarea>
                        </dd>
                    </div>
                </dl>

                <div class="action-buttons" id="form-actions"
                    style="display: none; justify-content: flex-start; gap: 10px; margin-top: 20px;">
                    <button type="submit" class="btn-edit"
                        style="background-color: var(--primary-color); color: white; border: none;">Save</button>
                    <button type="button" class="btn-edit" id="cancel-btn">Cancel</button>
                </div>
            </form>
        </main>
    </div>

    <script src="ContBook_IK.js"></script>
</body>

</html>
